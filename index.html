<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Events - Web-CRM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Кастомные стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark brand-navbar shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-calendar-check me-2"></i>AJ Events CRM</a>
            <div class="d-flex align-items-center">
                <span class="navbar-text text-white me-3">
                    Менеджер: Ансар
                </span>
                <button class="btn btn-outline-light btn-sm" id="themeToggle" title="Сменить тему">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container mt-4">
        <h2 class="mb-4 fw-bold">Складской учет оборудования</h2>

        <!-- Статистика -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card brand-card-blue text-white mb-3 shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title opacity-75">Всего позиций</h5>
                        <h2 id="totalItems" class="fw-bold">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card brand-card-gold text-white mb-3 shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title opacity-75">На складе (Доступно)</h5>
                        <h2 id="availableItems" class="fw-bold">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Управление таблицей и ФИЛЬТРЫ -->
        <div class="card shadow-sm mb-3 border-0 bg-body">
            <div class="card-body row align-items-center g-2">
                <div class="col-md-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Поиск по названию...">
                </div>
                <div class="col-md-3">
                    <select id="filterCategory" class="form-select">
                        <option value="All">Все категории</option>
                        <!-- Будет заполняться автоматически -->
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filterStatus" class="form-select">
                        <option value="All">Все статусы</option>
                        <!-- Будет заполняться автоматически -->
                    </select>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-brand-gold w-100 fw-bold" id="openAddModalBtn">
                        <i class="fa-solid fa-plus me-1"></i> Добавить вещь
                    </button>
                </div>
            </div>
        </div>

        <!-- Таблица инвентаря -->
        <div class="card shadow-sm border-0 bg-body">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>№</th>
                            <th>Наименование</th>
                            <th>Категория</th>
                            <th>Описание</th>
                            <th>Кол-во</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <!-- Данные будут загружаться через jQuery -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Универсальное Модальное окно -->
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">Новое оборудование</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="itemForm">
                        <input type="hidden" id="itemId">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Наименование</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Категория (Выберите или впишите свою)</label>
                            <input type="text" class="form-control" id="itemCategory" list="categoryList" placeholder="Например: Мебель" required>
                            <datalist id="categoryList"></datalist>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold text-uppercase">Описание</label>
                            <textarea class="form-control" id="itemDesc" rows="2" placeholder="Комплектация, комментарий..."></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">Кол-во</label>
                                <input type="number" class="form-control" id="itemQty" min="1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">Статус (Выберите или впишите)</label>
                                <input type="text" class="form-control" id="itemStatus" list="statusList" placeholder="Например: Списано" required>
                                <datalist id="statusList"></datalist>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-brand-gold" id="saveItemBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery и Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

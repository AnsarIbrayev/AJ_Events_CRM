<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJ Events - Web-CRM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-calendar-check me-2"></i>AJ Events CRM</a>
            <span class="navbar-text text-white">
                Менеджер: Ансар
            </span>
        </div>
    </nav>

    <!-- Основной контент -->
    <div class="container mt-4">
        <h2 class="mb-4">Управление складом (Инвентарь)</h2>

        <!-- Статистика -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Всего позиций</h5>
                        <h2 id="totalItems">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">На складе (Доступно)</h5>
                        <h2 id="availableItems">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Управление таблицей и ФИЛЬТРЫ -->
        <div class="card shadow-sm mb-3 p-3 bg-white">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Поиск по имени или ID...">
                </div>
                <div class="col-md-3">
                    <select id="filterCategory" class="form-select">
                        <option value="All">Все категории</option>
                        <option value="Звук">Звук</option>
                        <option value="Свет">Свет</option>
                        <option value="Декорации">Декорации</option>
                        <option value="Видео">Видео</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filterStatus" class="form-select">
                        <option value="All">Все статусы</option>
                        <option value="На складе">На складе</option>
                        <option value="На мероприятии">На мероприятии</option>
                        <option value="В ремонте">В ремонте</option>
                    </select>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-success w-100" id="openAddModalBtn">
                        <i class="fa-solid fa-plus me-1"></i> Добавить вещь
                    </button>
                </div>
            </div>
        </div>

        <!-- Таблица инвентаря -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>№</th>
                            <th>Наименование</th>
                            <th>Категория</th>
                            <th>Описание</th>
                            <th>Кол-во</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <!-- Данные будут загружаться через jQuery -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Универсальное Модальное окно (Добавление и Редактирование) -->
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Новое оборудование</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="itemForm">
                        <input type="hidden" id="itemId">
                        <div class="mb-3">
                            <label class="form-label">Наименование</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select class="form-select" id="itemCategory" required>
                                <option value="Звук">Звук</option>
                                <option value="Свет">Свет</option>
                                <option value="Декорации">Декорации</option>
                                <option value="Видео">Видео</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea class="form-control" id="itemDesc" rows="2" placeholder="Серийный номер, комплектация..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Количество</label>
                            <input type="number" class="form-control" id="itemQty" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Статус</label>
                            <select class="form-select" id="itemStatus">
                                <option value="На складе">На складе</option>
                                <option value="На мероприятии">На мероприятии</option>
                                <option value="В ремонте">В ремонте</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveItemBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery и Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
